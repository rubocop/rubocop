name: Create GitHub Release

on:
  push:
    tags:
      - "v*"  # Trigger when a version tag is pushed (e.g., v1.0.0)

jobs:
  create-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # A fine-grained token with contents write access to rubocop/docs.rubocop.org
      # and rubocop/rubocop.org, which sending them a repository dispatch requires.
      DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: RuboCop ${{ github.ref_name }}
          bodyFile: relnotes/${{ github.ref_name }}.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # Adds the tag to docs.rubocop.org's playbook and publishes the docs.
      - name: Publish the docs
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: rubocop/docs.rubocop.org
          event-type: release
          client-payload: '{"project": "rubocop", "tag": "${{ github.ref_name }}"}'

      # rubocop.org lists the latest releases, so rebuild it once this one exists.
      - name: Rebuild rubocop.org
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: rubocop/rubocop.org
          event-type: rubocop-release
